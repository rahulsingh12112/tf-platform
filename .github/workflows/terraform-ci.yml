name: Terraform CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Format check
        run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ec2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: Init (bina backend)
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
  
  docs:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Show Terraform version
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform version

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checkov
        run: pip install checkov
      - name: Security scan
        run: checkov -d ec2 --framework terraform --compact --soft-fail


  summary:
    runs-on: ubuntu-latest
    needs: [fmt, validate, security]
    steps:
      - name: Print run info
        run: |
          echo "Event:    ${{ github.event_name }}"
          echo "Branch:   ${{ github.ref_name }}"
          echo "Commit:   ${{ github.sha }}"
          echo "Actor:    ${{ github.actor }}"
          echo "Runner:   ${{ runner.os }}"
          echo "fmt=${{ needs.fmt.result }} validate=${{ needs.validate.result }} security=${{ needs.security.result }}"
          echo "Sab checks pass. EC2 code plan ke liye ready hai."
      
      - name: Only on main
        if: github.ref == 'refs/heads/main'
        run: echo "Ye step sirf main branch par chalta hai"